name: CI/CD Pipeline

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ─── Malware Scan (BLOCKING) ───────────────────────────────────────────────
  # Scans our OWN tracked source for the obfuscated-loader malware that was
  # committed to fetchit_fe as postcss.config.mjs and executed at build time.
  # Nothing else in this pipeline can see that: GitGuardian looks for secrets,
  # and `pnpm audit` only knows about published dependencies.
  #
  # Unlike the Security Audit job this one is BLOCKING, and every job that
  # installs or builds depends on it — the payload runs at build time, so
  # gating only the deploy would be too late. It installs nothing, so it costs
  # ~20s and runs before any package code executes.
  malware-scan:
    name: Malware Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # On a pull request, run the BASE branch's copy of the scanner against
      # the PR's files, so a pull request cannot weaken the check that guards
      # it.
      #
      # The fallback below runs the PR's own copy, which a malicious PR could
      # have neutered. That path exists only while the base branch has no
      # scanner — i.e. for the PR that introduces it, which is reviewed by a
      # human precisely because of this. Once merged the base always has a
      # copy, so the fallback is unreachable unless someone lands a deletion;
      # it therefore emits a loud warning annotation rather than passing
      # quietly.
      - name: Select scanner revision
        id: scanner
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          scanner="scripts/ci/malware-scan.sh"
          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            if git cat-file -e "FETCH_HEAD:scripts/ci/malware-scan.sh" 2>/dev/null; then
              mkdir -p "$RUNNER_TEMP/scanner"
              scanner="$RUNNER_TEMP/scanner/malware-scan.sh"
              git show "FETCH_HEAD:scripts/ci/malware-scan.sh" > "$scanner"
              chmod +x "$scanner"
              echo "Running the scanner from origin/$BASE_REF (not this PR's copy)."
            else
              echo "::warning::Base branch has no scanner - falling back to this PR's own copy, which the PR itself controls. Expected only for the change that introduces the scanner; review the diff by hand."
            fi
          fi
          echo "path=$scanner" >> "$GITHUB_OUTPUT"

      # Proves each blocking rule still fires on its own fixture, and that a
      # clean config does not. A detector nobody tests is not a detector.
      - name: Self-test the detector
        env:
          SCANNER: ${{ steps.scanner.outputs.path }}
        run: bash "$SCANNER" --self-test

      - name: Scan tracked source
        env:
          SCANNER: ${{ steps.scanner.outputs.path }}
        run: bash "$SCANNER"

  # ─── Install & cache (shared across quality jobs) ──────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    needs: malware-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # Cache key must bust on prisma/schema.prisma, not just the lockfile: a
      # schema-only PR (no dependency change) leaves the lockfile hash
      # identical, so this save is a no-op against an older cache already
      # sitting under that key on a long-lived branch like dev (cache writes
      # are immutable per key) — every downstream job then silently restores
      # node_modules/.prisma/client generated from the OLD schema. That's
      # exactly what broke the dev Test job after merging the
      # AWAITING_CONFIRMATION enum addition in PR #63: it passed on the PR's
      # own branch (fresh key, no prior cache to collide with) and only
      # failed once merged into dev (stale key already cached there).
      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'prisma/schema.prisma') }}

  # ─── Lint & Format(parallel with test) ─────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'prisma/schema.prisma') }}

      - name: Run linter
        run: pnpm lint

      - name: Format code
        run: pnpm format 

  # ─── Test (parallel with lint) ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fetchit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fetchit_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-jwt-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-32-characters!
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:4200

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'prisma/schema.prisma') }}

      - name: Run database migrations
        run: pnpm db:migrate:deploy

      - name: Run tests
        run: pnpm test

  # ─── Security Audit ────────────────────────────────────────────────────────
  # Reports known dependency vulnerabilities (pnpm audit). Non-blocking for
  # now — there is a backlog of pre-existing transitive advisories; this keeps
  # them visible on every run. Tighten to a hard gate (drop continue-on-error,
  # lower --audit-level) once the backlog is triaged.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'prisma/schema.prisma') }}

      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level=high

  # ─── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'prisma/schema.prisma') }}

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build application
        run: |
          rm -f tsconfig.build.tsbuildinfo
          pnpm build

      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          retention-days: 1
          path: |
            dist/
            prisma/
            package.json
            pnpm-lock.yaml
            tsconfig.json
            tsconfig.build.json
            nest-cli.json
            ecosystem.config.js
            scripts/server-setup.sh

  # ─── Deploy ────────────────────────────────────────────────────────────────
  # Branch → GitHub Environment → secrets:
  #   dev     → development → APP_PATH, ENV_FILE, SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY, SERVER_PORT
  #   staging → staging     → APP_PATH, ENV_FILE, SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY, SERVER_PORT
  #   main    → production  → APP_PATH, ENV_FILE, SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY, SERVER_PORT
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [malware-scan, lint, test, build]
    if: github.event_name == 'push'
    environment:
      name: >-
        ${{
          github.ref_name == 'main'    && 'production'  ||
          github.ref_name == 'staging' && 'staging'     ||
          'development'
        }}
    steps:
      - name: Resolve deploy environment name
        id: ctx
        run: |
          case "$GITHUB_REF_NAME" in
            main)    echo "env=production"  >> "$GITHUB_OUTPUT" ;;
            staging) echo "env=staging"     >> "$GITHUB_OUTPUT" ;;
            *)       echo "env=development" >> "$GITHUB_OUTPUT" ;;
          esac

      # Migrations run HERE, not on the server. The deploy box cannot open
      # outbound TCP 5432 (UpCloud trial firewall), and while the app works
      # around that with Neon's WebSocket driver on 443, `prisma migrate` has
      # no driver-adapter path and needs real 5432. The runner has it.
      #
      # This runs BEFORE the code ships, so the old process briefly serves
      # against the new schema: keep migrations additive/backwards-compatible.
      #
      # It uses the POOLED Neon endpoint deliberately: the direct endpoint is
      # unreachable (verified, P1002), so a `directUrl` would point at nothing.
      # `migrate deploy` takes a session advisory lock, which transaction
      # pooling classically cannot hold — but it was verified working through
      # this pooler (exit 0, lock acquired, "No pending migrations"). If that
      # ever regresses, the fix is a DIRECT_URL secret once the Neon project
      # exposes a reachable direct endpoint, not moving this step back onto
      # the box, which has no 5432 at all.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'prisma/schema.prisma') }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./artifacts

      - name: Run database migrations
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -e
          # tr -d '\r' first: a secret pasted with CRLF endings otherwise
          # leaves a trailing \r inside the value, which also defeats the
          # quote strip and makes Prisma fail on a bogus database name.
          # `|| true` so a missing line reaches the explicit check below
          # instead of aborting the step with no diagnostic under `set -e`.
          DATABASE_URL=$(printf '%s\n' "$ENV_FILE" | tr -d '\r' | grep -m1 '^DATABASE_URL=' | cut -d= -f2- || true)
          DATABASE_URL=${DATABASE_URL%\"}
          DATABASE_URL=${DATABASE_URL#\"}
          DATABASE_URL=${DATABASE_URL%\'}
          DATABASE_URL=${DATABASE_URL#\'}
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL in the ENV_FILE secret for this environment." >&2
            exit 1
          fi
          # Keep it out of the log even though it came from a masked secret:
          # the extracted substring is not masked on its own.
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          # The lockfile-pinned CLI, so the migration engine always matches the
          # @prisma/client the build was generated against. Fetching
          # `prisma@<hardcoded>` from the registry here would sidestep both
          # --frozen-lockfile integrity and the blocking malware scan.
          pnpm db:migrate:deploy

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Ensure APP_PATH exists on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_PATH: ${{ secrets.APP_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p '$APP_PATH'"

      - name: Rsync to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_PATH: ${{ secrets.APP_PATH }}
        run: |
          # Excludes are ANCHORED to the transfer root with a leading '/'. An
          # unanchored 'storage/' matches a directory of that name at ANY depth,
          # so it also skipped dist/storage - the app's own storage module -
          # and, with --delete, protected the stale copy there from removal.
          # Every other file in dist/ updated, so the server ran a new admin
          # service against a months-old StorageService ("getSignedUrl is not a
          # function"), and the Neon driver never reached the box. 'logs/' did
          # the same to dist/logs. The aim is only to protect the server's own
          # top-level data: storage/uploads, logs/, .env and node_modules.
          rsync -avz --delete \
            --exclude='/.env' \
            --exclude='/node_modules' \
            --exclude='/logs/' \
            --exclude='/storage/' \
            -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \
            ./artifacts/ \
            "$SERVER_USER@$SERVER_HOST:$APP_PATH/"

      - name: Write .env file to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: ENV_FILE,APP_PATH,STORAGE_DRIVER,STORAGE_NEON_BUCKET,STORAGE_NEON_PUBLIC_BUCKET,STORAGE_NEON_PUBLIC_PREFIXES,AWS_ENDPOINT_URL_S3,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            set -eu

            # ENV_FILE is still the bulk of the file, written wholesale.
            printf '%s' "$ENV_FILE" > "$APP_PATH/.env"

            # ENV_FILE is written with `printf '%s'`, so it does NOT
            # necessarily end in a newline. Without this, the first appended
            # line below would be glued onto its last line.
            if [ -s "$APP_PATH/.env" ] && [ "$(tail -c1 "$APP_PATH/.env" | wc -l)" -eq 0 ]; then
              printf '\n' >> "$APP_PATH/.env"
            fi

            # Storage settings come from their own secrets rather than from
            # inside ENV_FILE, so rotating a Neon credential does not mean
            # re-pasting the whole env file. An empty secret is skipped, which
            # leaves whatever ENV_FILE had for that name — so an environment
            # that has not been given these keeps working unchanged. A secret
            # that IS set wins: its name is stripped from the ENV_FILE body
            # first, so the file never ends up with the same key twice.
            append_env() {
              _name="$1"
              _value="$2"
              [ -n "$_value" ] || return 0
              # This file takes credentials, so it must never exist at the
              # remote umask even briefly: grep writes secrets into it before
              # any later chmod could run. Created 0600 up front; the `>`
              # below truncates in place and keeps that mode.
              rm -f "$APP_PATH/.env.next"
              (umask 077 && : > "$APP_PATH/.env.next")

              # `if`, not `cmd` then `$?`: under `set -e` a nonzero grep exits
              # the script before the status can be read — and status 1,
              # "selected no lines", is a NORMAL outcome here (an empty .env,
              # or one holding only this key). Only >1 is a real read/write
              # error, and a blanket `|| true` used to accept that too, which
              # could move a truncated .env.next over .env and leave the app
              # booting against missing configuration.
              if grep -v "^[[:space:]]*${_name}=" "$APP_PATH/.env" > "$APP_PATH/.env.next"; then
                _status=0
              else
                _status=$?
              fi
              if [ "$_status" -gt 1 ]; then
                echo "::error::grep failed with status $_status while rewriting .env for $_name; leaving .env untouched" >&2
                rm -f "$APP_PATH/.env.next"
                return "$_status"
              fi

              # `>` into the existing .env keeps its inode and mode, but `mv`
              # replaces both — so a .env an operator had restricted would come
              # back at the remote umask. Carry the mode across rather than
              # imposing one, since the app user may not be this SSH user; and
              # abort rather than install a file whose intended mode is unknown.
              if ! _mode="$(stat -c %a "$APP_PATH/.env")"; then
                echo "::error::could not read $APP_PATH/.env's mode; leaving it untouched rather than replacing it at the default umask" >&2
                rm -f "$APP_PATH/.env.next"
                return 1
              fi
              chmod "$_mode" "$APP_PATH/.env.next"
              mv "$APP_PATH/.env.next" "$APP_PATH/.env"
              printf '%s=%s\n' "$_name" "$_value" >> "$APP_PATH/.env"
              echo "  + $_name"
            }

            echo "Applying storage settings from their own secrets (names only, never values):"
            append_env STORAGE_DRIVER "${STORAGE_DRIVER:-}"
            append_env STORAGE_NEON_BUCKET "${STORAGE_NEON_BUCKET:-}"
            append_env STORAGE_NEON_PUBLIC_BUCKET "${STORAGE_NEON_PUBLIC_BUCKET:-}"
            append_env STORAGE_NEON_PUBLIC_PREFIXES "${STORAGE_NEON_PUBLIC_PREFIXES:-}"
            append_env AWS_ENDPOINT_URL_S3 "${AWS_ENDPOINT_URL_S3:-}"
            append_env AWS_REGION "${AWS_REGION:-}"
            append_env AWS_ACCESS_KEY_ID "${AWS_ACCESS_KEY_ID:-}"
            append_env AWS_SECRET_ACCESS_KEY "${AWS_SECRET_ACCESS_KEY:-}"
            echo "(nothing listed above means those secrets are unset for this environment)"
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          APP_PATH: ${{ secrets.APP_PATH }}
          # Optional: unset secrets arrive as empty strings and are skipped.
          STORAGE_DRIVER: ${{ secrets.STORAGE_DRIVER }}
          STORAGE_NEON_BUCKET: ${{ secrets.STORAGE_NEON_BUCKET }}
          STORAGE_NEON_PUBLIC_BUCKET: ${{ secrets.STORAGE_NEON_PUBLIC_BUCKET }}
          STORAGE_NEON_PUBLIC_PREFIXES: ${{ secrets.STORAGE_NEON_PUBLIC_PREFIXES }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: APP_PATH,DEPLOY_ENV,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT
          script: |
            # ssh-action runs the script as one blob and takes the LAST
            # command status as the step status, so without this a failed
            # install or migration was invisible: the step exited 0 on the
            # trailing echo and the health check then passed against the
            # still-running OLD process - a deploy that shipped nothing
            # reported green. `set -e` rather than the action's script_stop
            # input, because script_stop injects a per-line exit check that
            # breaks multi-line constructs (the `if` below, the backslash
            # continuation further down). Verified on the target box: the
            # `if` block runs, `|| true` is tolerated, a failure aborts.
            set -e

            # nvm is optional - this box uses a system-wide Node install and
            # has no ~/.nvm. Written as `if` rather than `[ -s ... ] && ...`
            # because the latter yields exit 1 when the file is absent, which
            # under `set -e` would abort the deploy on its first line.
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # shellcheck disable=SC1091
              . "$NVM_DIR/nvm.sh"
            fi

            # pnpm here is the corepack shim, which resolves the
            # `packageManager` pin (pnpm@9.15.0) from package.json once we are
            # inside APP_PATH. Do NOT `corepack enable`: the shim directory is
            # root-owned and this step is not root, so it fails with EACCES.
            # The download prompt must be silenced - an SSH deploy has no TTY.
            export COREPACK_ENABLE_DOWNLOAD_PROMPT=0

            export DEPLOY_ENV="$DEPLOY_ENV"

            cd "$APP_PATH"

            # Written immediately before the PM2 replacement below, and read by
            # the failure path to decide whether pm2 may be touched at all. A
            # failure before this step ever runs (migrations, rsync, the .env
            # write) must find no marker.
            #
            # Scoped to the ATTEMPT, not just the run: a re-run keeps the same
            # GITHUB_RUN_ID, and the sweep below only executes once this step
            # is reached. So after a successful attempt left its marker behind,
            # a re-run failing EARLIER than this step would have found that
            # marker and deleted a healthy app.
            PM2_MARKER="/tmp/fetchit-deploy-pm2-touched-$DEPLOY_ENV-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            rm -f "/tmp/fetchit-deploy-pm2-touched-$DEPLOY_ENV-"* || true

            node -v
            pnpm -v
            pm2 -v

            # Snapshot the current PM2 process list so the failure path has
            # something current to resurrect.
            pm2 save --force || true

            # Install dependencies. Not --prod: the Prisma CLI used by the two
            # commands below is a devDependency.
            #
            # Must be non-interactive. When node_modules was built by a
            # different pnpm/store layout, pnpm asks "The modules directory
            # will be removed and reinstalled from scratch. Proceed?"; with no
            # TTY that prompt aborts or silently no-ops, leaving node_modules
            # stale (a newly added dependency is then missing at boot).
            # CI=true + confirmModulesPurge=false makes pnpm answer itself.
            #
            # pnpm may purge the live node_modules before reinstalling, so keep
            # a hard-linked copy (cheap: no data is copied) and put it back if
            # the install or the guard below FAILS. This does not cover the
            # script itself being killed mid-install: the restore never runs
            # and the next deploy's rsync --delete removes the stale copy.
            # The running process keeps its loaded modules, but a later PM2
            # restart needs them intact.
            rm -rf node_modules.prev
            if [ -d node_modules ]; then cp -al node_modules node_modules.prev; fi

            # The guard fails loudly if the install did not actually deliver
            # the runtime dependencies the new build needs.
            if ! { CI=true pnpm install --frozen-lockfile --config.confirmModulesPurge=false \
                   && node -e "require.resolve('@aws-sdk/s3-request-presigner')"; }; then
              echo "::error::pnpm install failed or left node_modules stale"
              if [ -d node_modules.prev ]; then
                rm -rf node_modules
                mv node_modules.prev node_modules
              fi
              exit 1
            fi
            rm -rf node_modules.prev

            # Generate Prisma client. No DB connection needed, unlike
            # `migrate deploy`, which runs on the runner (see above) because
            # this box has no outbound 5432.
            pnpm db:generate

            # From here on the running process is being replaced, so the
            # failure path is allowed to delete and resurrect. Everything above
            # (install, db:generate) leaves the old process untouched, and a
            # failure there must NOT take it down.
            : > "$PM2_MARKER"

            # Reload (zero-downtime) or start the correct PM2 app for this env
            pm2 reload ecosystem.config.js --env "$DEPLOY_ENV" \
              || pm2 start ecosystem.config.js --env "$DEPLOY_ENV"

            # Verify the process we just reloaded is actually running FROM
            # APP_PATH. `pm2 reload` keeps an existing app's original pm_cwd, so
            # a process first started from another directory keeps serving that
            # tree while every deploy rsyncs new code into APP_PATH — a deploy
            # that reports green while shipping nothing. The health check cannot
            # catch it, because the old build answers /health/readiness too.
            APP_NAME="fetchit-be-$DEPLOY_ENV"
            # Trailing slashes are stripped from both sides before comparing:
            # APP_PATH comes from a secret and may well end in '/', while pm2
            # reports cwd without one. A literal comparison would then look
            # like a mismatch and delete a healthy process on every deploy.
            # "/" must survive: stripping it to "" would make the check below
            # treat a root-directory app as "cwd unknown" and skip silently.
            # Strips EVERY trailing slash, not just one: APP_PATH comes from a
            # secret and '/srv/fetchit//' would otherwise keep one and read as a
            # mismatch against the pm_cwd pm2 reports, which has none. '/' is
            # preserved, since reducing it to '' would make the check below
            # treat a root-directory app as "cwd unknown" and skip silently.
            strip_slash() {
              _path="$1"
              while [ "$_path" != "/" ] && [ "${_path%/}" != "$_path" ]; do
                _path="${_path%/}"
              done
              printf '%s' "$_path"
            }
            # pwd -P, not APP_PATH: this script has already `cd`-ed into
            # APP_PATH, and ecosystem.config.js anchors the app with
            # `__dirname`, which Node resolves through symlinks. If APP_PATH is
            # or traverses a symlink, pm_cwd comes back physical while APP_PATH
            # is not — a mismatch that survives the delete-and-restart and so
            # fails every single deploy.
            WANT_CWD="$(strip_slash "$(pwd -P)")"
            # Prints the app's pm_cwd, or nothing if that cannot be determined
            # (app absent, or `pm2 jlist` emitting something other than JSON).
            # Unknown must never fail the deploy on its own — this check exists
            # to catch a real mismatch, not to add a new way for CI to break.
            read_cwd() {
              pm2 jlist 2>/dev/null | APP_NAME="$APP_NAME" node -e '
                let raw = "";
                process.stdin
                  .on("data", (chunk) => (raw += chunk))
                  .on("end", () => {
                    try {
                      const app = JSON.parse(raw).find((p) => p.name === process.env.APP_NAME);
                      process.stdout.write(app ? app.pm2_env.pm_cwd || "" : "");
                    } catch {
                      process.stdout.write("");
                    }
                  });
              ' || true
            }

            RUNNING_CWD="$(strip_slash "$(read_cwd || true)")"
            if [ -z "$RUNNING_CWD" ]; then
              echo "::warning::Could not read $APP_NAME's working directory from pm2, so the deployed-build check was skipped. Verify by hand: pm2 describe $APP_NAME | grep 'exec cwd'"
            elif [ "$RUNNING_CWD" != "$WANT_CWD" ]; then
              echo "::warning::$APP_NAME was running from '$RUNNING_CWD', not '$WANT_CWD' - recreating it so it serves the deployed build."
              # Not zero-downtime, but this process is serving the wrong code,
              # so a restart is the point rather than a cost.
              pm2 delete "$APP_NAME" || true
              pm2 start ecosystem.config.js --env "$DEPLOY_ENV"
              RUNNING_CWD="$(strip_slash "$(read_cwd || true)")"

              if [ "$RUNNING_CWD" != "$WANT_CWD" ]; then
                echo "$APP_NAME runs from '$RUNNING_CWD' instead of '$WANT_CWD' and could not be re-anchored; it is serving a different build than this deploy shipped." >&2
                exit 1
              fi
              echo "Re-anchored $APP_NAME to $WANT_CWD."
            else
              echo "Verified $APP_NAME is running from $WANT_CWD."
            fi

            # NOTE: `pm2 save` deliberately does NOT run here. The snapshot is
            # written only after the health check passes (see the step below),
            # so the failure path still has the PREVIOUS process list to
            # resurrect. Saving here would overwrite that snapshot with the
            # replacement this deploy just started — and since a re-anchor
            # deletes the old process rather than reloading it, there would be
            # nothing left to roll back to.

            echo "Deployed to $DEPLOY_ENV."
        env:
          APP_PATH: ${{ secrets.APP_PATH }}
          DEPLOY_ENV: ${{ steps.ctx.outputs.env }}

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: APP_PORT,DEPLOY_ENV
          script: |
            # Must match the per-env PORT in ecosystem.config.js; APP_PORT, if
            # set, wins. A hardcoded 6100 silently probed the wrong port on
            # staging/production and failed after two minutes.
            case "$DEPLOY_ENV" in
              staging)    DEFAULT_PORT=6101 ;;
              production) DEFAULT_PORT=6102 ;;
              *)          DEFAULT_PORT=6100 ;;
            esac
            PORT="${APP_PORT:-$DEFAULT_PORT}"
            echo "Waiting for application to become ready on port $PORT..."
            for i in $(seq 1 12); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 5 \
                "http://localhost:${PORT}/api/v1/health/readiness" || echo "000")
              echo "Attempt $i: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed."
                exit 0
              fi
              sleep 10
            done
            echo "Health check failed after 2 minutes."
            exit 1
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
          DEPLOY_ENV: ${{ steps.ctx.outputs.env }}

      # Only now is the running process known good, so this is when the
      # snapshot is written. Before this point `dump.pm2` still describes the
      # process list from BEFORE the deploy, which is what the failure path
      # below needs in order to roll back to something that worked.
      - name: Persist PM2 process list
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_ENV,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT
          script: |
            # The replacement has passed readiness, so the marker's job - letting
            # the failure path delete a replacement that never came up healthy -
            # is done. Clear it BEFORE `pm2 save`: if the save fails, the restore
            # step must leave this verified process alone rather than delete it
            # and resurrect the stale pre-deploy dump (which, after a pm_cwd
            # re-anchor, would bring back the old tree). The step still fails,
            # flagging that the snapshot on disk is out of date.
            rm -f "/tmp/fetchit-deploy-pm2-touched-$DEPLOY_ENV-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            pm2 save
        env:
          DEPLOY_ENV: ${{ steps.ctx.outputs.env }}

      # Copies files the `local` driver left on disk into Neon and repoints
      # stored avatar URLs (src/cli/migrate-local-storage.ts). Runs after every
      # deploy because it is idempotent: keys already in Neon are skipped, so
      # after the first pass this is a quick no-op. A no-op too on any driver
      # other than `neon`.
      #
      # After the health check and the PM2 snapshot, so it only ever runs
      # against a verified build, and `continue-on-error` so a file that will
      # not copy is a visible warning on a deploy that otherwise worked - never
      # a red deploy, and never a trigger for the PM2 restore below (which
      # `if: failure()` does not see from a continue-on-error step).
      - name: Migrate local uploads into Neon
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: APP_PATH
          script: |
            set -e
            cd "$APP_PATH"
            node dist/cli/migrate-local-storage.js --only-if-neon
        env:
          APP_PATH: ${{ secrets.APP_PATH }}

      - name: Restore previous PM2 process list on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_ENV,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT
          script: |
            [ -f "$HOME/.bashrc" ] && source "$HOME/.bashrc"
            [ -f "$HOME/.profile" ] && source "$HOME/.profile"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            # This restores the saved PM2 process list only. It does NOT roll
            # back code (rsync has already overwritten dist/) or migrations
            # (prisma migrate deploy is forward-only). A failed deploy needs
            # manual attention; it is not automatically reverted.
            #
            # The delete is GATED on the marker the post-deploy step writes
            # immediately before it replaces the process. `if: failure()` also
            # fires for migrations, rsync, the .env write, and for `pnpm
            # install` / `pnpm db:generate` INSIDE the post-deploy step — all of
            # which leave the running process untouched. Deleting then would
            # stop a healthy app and hand its fate to `pm2 resurrect`, which is
            # `|| true` and may not bring it back. Gating on the step's outcome
            # would not be enough, since install and db:generate share the step
            # with the reload.
            #
            # Once the marker exists the app was reloaded or recreated under the
            # same name, and `pm2 resurrect` will not displace a running app, so
            # the failed replacement has to go first or this restores nothing
            # and leaves the broken process serving traffic.
            PM2_MARKER="/tmp/fetchit-deploy-pm2-touched-${DEPLOY_ENV:-development}-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-unknown}"
            if [ -f "$PM2_MARKER" ]; then
              echo "Removing the failed replacement before restoring..."
              npx pm2 delete "fetchit-be-${DEPLOY_ENV:-development}" || true
              rm -f "$PM2_MARKER" || true
              echo "Restoring saved PM2 process list..."
              # A failed resurrect means the app is DOWN with nothing else
              # coming to start it, so it must not pass silently the way the
              # other `|| true` cleanups do.
              if npx pm2 resurrect; then
                echo "Restored."
              else
                echo "::error::pm2 resurrect FAILED after removing the failed replacement - fetchit-be-${DEPLOY_ENV:-development} is DOWN and needs manual attention: pm2 start ecosystem.config.js --env ${DEPLOY_ENV:-development}"
              fi
            else
              echo "No replacement awaiting rollback - the deploy either never reached the PM2 replacement or it already passed readiness - leaving the running process alone."
            fi
            echo "Check server logs; code and migrations are NOT reverted."
        env:
          # `envs:` only forwards variables that are already in THIS step's
          # environment. Without this block DEPLOY_ENV was empty on the remote
          # side and the delete fell back to 'fetchit-be-development' — which
          # on a failed staging or production deploy means the wrong app name:
          # the broken replacement survives and a healthy development process
          # gets deleted instead.
          DEPLOY_ENV: ${{ steps.ctx.outputs.env }}

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f /tmp/ssh_key /tmp/known_hosts
          rm -f .env
